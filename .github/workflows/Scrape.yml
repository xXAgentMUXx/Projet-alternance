name: Job Scraper

on:
  schedule:
    - cron: "0 */3 * * *"   # toutes les 3h
  workflow_dispatch:          # déclenchement manuel depuis GitHub UI
    inputs:
      scrapers:
        description: "Scrapers à lancer (tous si vide)"
        required: false
        default: ""

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 3. Chrome + Chromedriver (pour Selenium) ─────────────────────────────
      - name: Installer Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Vérifier Chrome
        run: |
          google-chrome --version
          chromedriver --version

      # ── 4. Playwright (pour Meteojob) ────────────────────────────────────────
      - name: Installer Playwright Chromium
        run: playwright install chromium --with-deps

      # ── 5. Récupérer les JSON existants depuis Oracle ────────────────────────
      # On télécharge les JSON actuels pour que mark_new_jobs fonctionne
      # (sans ça, tous les jobs seraient marqués "new" à chaque run)
      - name: Récupérer les JSON existants depuis Oracle
        env:
          ORACLE_API_URL: ${{ secrets.ORACLE_API_URL }}
        run: |
          python scripts/fetch_existing_jobs.py
        continue-on-error: true   # ne bloque pas si Oracle est down

      # ── 6. Récupérer la config des boards depuis Oracle ───────────────────────
      - name: Récupérer la config boards/companies
        env:
          ORACLE_API_URL: ${{ secrets.ORACLE_API_URL }}
        run: |
          python scripts/fetch_config.py
        continue-on-error: true

      # ── 7. Lancer les scrapers ───────────────────────────────────────────────
      - name: Lancer tous les scrapers en parallèle
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          SCRAPER_KEYWORD:   ${{ vars.SCRAPER_KEYWORD || 'alternance développeur' }}
          SCRAPER_CITY:      ${{ vars.SCRAPER_CITY    || 'Montpellier' }}
          TARGET_SCRAPERS:   ${{ github.event.inputs.scrapers || '' }}
        run: |
          python scripts/run_scrapers.py

      # ── 8. Uploader les résultats vers Oracle ────────────────────────────────
      - name: Uploader les résultats vers Oracle
        env:
          ORACLE_API_URL:    ${{ secrets.ORACLE_API_URL }}
          ORACLE_API_SECRET: ${{ secrets.ORACLE_API_SECRET }}
        run: |
          python scripts/push_results.py

      # ── 9. Archiver les JSON en artifact (debug) ─────────────────────────────
      - name: Archiver les résultats JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: job-results-${{ github.run_id }}
          path: |
            *_jobs.json
            seen_jobs.json
            auto_notifications.json
          retention-days: 7
